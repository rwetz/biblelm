[package]
name = "biblelm"
version = "2.0.0"
edition = "2021"

[lib]
name = "biblelm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# Optional network calls (Jev, grounded commentary): small blocking client, rustls.
ureq = { version = "2", features = ["json"] }
# Opt-in model keys live in the OS keychain, never in files.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
