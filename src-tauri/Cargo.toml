[package]
name = "biblelm"
version = "2.1.0"
edition = "2021"

[lib]
name = "biblelm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# The optional Jev call: small blocking client, rustls.
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
# Reads TYPESAFE_API_KEY from the saved user environment when the process lacks it.
winreg = "0.52"
